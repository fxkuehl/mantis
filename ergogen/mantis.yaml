units:
  # Hex key spacing
  hx: 21.5
  hy: 18.62
  # Margin around the PCB
  mx: 2.75
  my: 1.1547mx
  # Distance between key clusters
  dx: 3
  dy: 1.1547dx
  # Space around keys and fillet radius
  kx: 0.54/2
  ky: 1.1547kx
  fk: 3
  # Trackball diameter
  d_ball: 34
  # MCU vertical offset from top row key center
  mcu_top: hy/3 + dy/2
  # Space for mounting HW near main PCB rear
  mount_width: 6

points:
  zones:
    # Just key positions for reference, without any rotation
    # Origin aligns the center/split line with both inch and mm rasters
    f:
      anchor:
        shift: [254-10hx/2-dx/2, -127+2hy]
      columns:
        c0:
          rows:
            r0: $unset
            r1: $unset
            r2:
              shift: [0]
        c1:
          rows:
            r0: $unset
          key:
            stagger: -hy
            spread: hx/2
        c2:
          rows:
            r0: $unset
        c3:
          rows:
            r1:
              shift: [hx/2]
          key:
            stagger: -hy
            spread: hx/2
        c4:
          rows:
            r0: $unset
        c5:
          rows:
            r0: $unset
            r1: $unset
            r2:
              shift: [0]
      rows:
        r0:
        r1:
        r2:
          shift: [hx/2]
        r3:
          shift: [hx/2]
    t:
      anchor:
        shift: [254-5hx/2-dx/2, -127-hy-dy]
      columns:
        c1:
        c2:
        c3:
          key:
            stagger: -hy
            spread: hx/2
      rows:
        r1:

    # This section defines the switch matrix and switch rotation. Keys
    # are rotated in 60° increments to make a simulated key well with
    # sclupted keycaps.
    #
    # The 7x6 matrix for up to 42 keys leaves room for two mouse buttons.
    # Each keyboard half as 3 rows, 7 columns. Thus mirroring changes the
    # the row net. The raised PCB uses 2 mirrored "rows" and 4 "columns"
    # for an optimal 4x4 matrix requiring 8 pins to connect the two PCBs.
    # Matrix "rows" correspond approximately with rows on the main PCB
    # and columns on the raised PCB. The top two rows on main have 4
    # columns, the lower row as 3 columns. The lowest middle finger and
    # thumb key as well as a possible mouse key are added to the top
    # 4-column row. The raised PCB "rows" complete the lower two rows
    # of the main PCB.
    #
    # Each row uses its own zone to make the key rotation easier.
    # Otherwise the spread and stagger get very confusing because they
    # are relative to the rotation of the first key in the previous row
    # in the same zone.
    #
    # Left and right are flipped so that the diodes and sockets can be
    # mounted on the "front" side of the PCB. That avoids having to flip
    # the footprints to the bottom of the PCB, which messes up the
    # rotations in KiCAD.
    zn1: # Lower row (3) + outer raised column (4) = 7
      anchor.ref: f_c4_r3
      rows.r:
        rotate: 180
        row_net: R1
        mirror.row_net: L1
      columns:
        c1:
          rows.r.rotate: -60
          key.column_net: C1
        c2.key:
          spread: -7hx/2
          stagger: -hy
          column_net: C2
        c3.key.column_net: C3
        c4.key.column_net: C4
        c5:
          rows.r.rotate: -120
          key.column_net: C5
        c6.key:
          spread: -hx/2
          stagger: -hy
          column_net: C6
        c7:
          rows.r.rotate: 60
          key:
            spread: -hx/2
            stagger: -hy - dy
            column_net: C7
    zn2: # Middle row (4) + inner raised column (3) = 7
      anchor.ref: f_c0_r2
      rows.r:
        rotate: -120
        row_net: R2
        mirror.row_net: L2
      columns:
        c1:
          rows.r.rotate: 120
          key.column_net: C1
        c2.key.column_net: C2
        c3.key.column_net: C3
        c4.key.column_net: C4
        c5.key:
          spread: 3hx/2
          stagger: -hy
          column_net: C5
        c6.key:
          spread: -hx/2
          stagger: -hy
          column_net: C6
        c7:
          rows.r.rotate: 0
          key:
            spread: -hx/2
            stagger: -hy - dy
            column_net: C7
    zn3: # Upper row (4) + lowest middle-finger, thumb, mouse (3) = 7
      anchor.ref: f_c0_r3
      rows.r:
        rotate: -60
        row_net: R3
        mirror.row_net: L3
      columns:
        c1:
          rows.r.rotate: 0
          key.column_net: C1
        c2.key.column_net: C2
        c3.key.column_net: C3
        c4.key.column_net: C4
        c5:
          rows.r.rotate: 180
          key:
            spread: -3hx/2
            stagger: -3hy
            column_net: C5
        # c6 available for a mouse button
        c7:
          rows.r.rotate: 0
          key:
            spread: 2hx
            stagger: -2hy - dy
            column_net: C7
  key:
    spread: hx
    padding: hy
  mirror:
    ref: f_c5_r3
    distance: hx+dx

outlines:
  _main_template:
    $params: [mx, my]
    # All points of the main outline are relative to non-rotated
    # keys to keep it sane.
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, -2hy/3-my]
        - ref: t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: f_c0_r3
          shift: [hx/2, hy+my]
        - ref: f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: f_c0_r3
          shift: [5hx/2, hy+my]

        - ref: f_c0_r3
          shift: [9hx/2+dx/2, my-dy/4-hy/3]

        - ref: mirror_f_c0_r3
          shift: [5hx/2, hy+my]
        - ref: mirror_f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: mirror_f_c0_r3
          shift: [hx/2, hy+my]
        - ref: mirror_f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: mirror_f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: mirror_t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: mirror_t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: mirror_t_c3_r1
          shift: [0, -2hy/3-my]

        - ref: t_c3_r1
          shift: [hx+dx/2, -my+dy/4]
    mcu_fill:
      what: rectangle
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-4hy/3 + mx]
      size: [4hx+dx, 8hy/3]
      operation: add
      fillet: mx+kx+fk
  _main_split_template:
    $params: [mx, my]
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, -2hy/3-my]
        - ref: t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: f_c0_r3
          shift: [hx/2, hy+my]
        - ref: f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: f_c0_r3
          shift: [5hx/2, hy+my]

        - ref: f_c0_r3
          shift: [7hx/2+mx, hy/3+my/2]
        - shift: [0, -4hy/3-my]
        - shift: [-2hx/2, -2hy/3]
        - shift: [0, -6hy/3-dy+my]
        - shift: [3hx/2, -3hy/3]
        - shift: [0, -2hy/3-my]
  _main_split:
    $extends: outlines._main_split_template
    $args: [0, 0]
  _main_internal:
    $extends: outlines._main_template
    $args: [0, 0]
  _main_padded:
    $extends: outlines._main_template
    $args: [kx, ky]
  _main_external:
    $extends: outlines._main_template
    $args: [mx, my]
  _raised_template:
    $params: [rx, ry]
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [hx+dx/2, -dy/4-(ry)+my]
        - shift: [-hx-dx/2-kx, 2hy/3+dy/4+ky/2]
        - shift: [0, -my]
        - shift: [-hx/2, -hy/3]
        - shift: [0, -ky]
        - shift: [-hx/2+kx, -hy/3+ky/2]
        - shift: [-hx-(rx), 2hy/3+(ry)/2]
        - shift: [0, 2hy/3+(ry)]
        - shift: [hx/2+kx, hy/3+ky/2]
        - shift: [0, 2hy/3+dy-ky]
        - shift: [hx/2, hy/3]
        - shift: [0, 2hy/3]
        - shift: [hx/2, hy/3]
        - shift: [0, 2hy/3]

        # Extended center to mount controller
        - shift: [hx/2, hy/3]
        - shift: [0, hy/3-(ry)/2+ky/2+(rx)+mcu_top]
        - shift: [2hx+dx+2(rx)-2kx, 0]
        - shift: [0, -hy/3+(ry)/2-ky/2-(rx)-mcu_top]
        - shift: [hx/2, -hy/3]

        # Fitted center for controller on the main PCB
        #- shift: [hx/2+rx, hy/3+ry/2]
        #- shift: [hx/2+rx, -hy/3-ry/2]
        #- shift: [0, -2hy/3]
        #- shift: [hx/2+dx/2-rx, -hy/3-dy/4+ry/2]

        #- shift: [hx/2+dx/2-rx, hy/3+dy/4-ry/2]
        #- shift: [0, 2hy/3]
        #- shift: [hx/2+rx, hy/3+ry/2]
        #- shift: [hx/2+rx, -hy/3-ry/2]
        # End center

        - shift: [0, -2hy/3]
        - shift: [hx/2, -hy/3]
        - shift: [0, -2hy/3]
        - shift: [hx/2, -hy/3]
        - shift: [0, -2hy/3-dy+ky]
        - shift: [hx/2+kx, -hy/3-ky/2]
        - shift: [0, -2hy/3-(ry)]
        - shift: [-hx-(rx), -2hy/3-(ry)/2]
        - shift: [-hx/2+kx, hy/3-ky/2]
        - shift: [0, ky]
        - shift: [-hx/2, hy/3]
        - shift: [0, my]
      fillet: fk+(rx)
  _raised:
    $extends: outlines._raised_template
    $args: [0, 0]

  _hexagon_template:
    $params: [kx, ky]
    poly:
      what: polygon
      points:
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
        - shift: [0, 2.0hy/3-(ky)]
        - shift: [hx/2-(kx), hy/3-(ky)/2]
        - shift: [hx/2-(kx), -hy/3+(ky)/2]
        - shift: [0, -2.0hy/3+(ky)]
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
  _half_hex_template:
    $params: [kx, ky]
    poly:
      what: polygon
      points:
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
        - shift: [0, 2.0hy/3-(ky)]
        - shift: [(hx-(kx))/2, -hy/3+(ky)/2]
        - shift: [(hx-(kx))/2,  hy/3-(ky)/2]
        - shift: [0, -2.0hy/3+(ky)]
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
  _key_hexagon:
    $extends: outlines._hexagon_template
    $args: [kx, ky]
  _key_silkscreen:
    $extends: outlines._hexagon_template
    $args: [2*kx, 2*ky]
  _nibble_hexagon:
    $extends: outlines._hexagon_template
    $args: [0, 0]
  _nibble_half_hex:
    $extends: outlines._half_hex_template
    $args: [0, 0]
  _key_slot_hexagon:
    $extends: outlines._hexagon_template
    $args: [-kx, -ky]
  _rounded_nibble:
    - what: outline
      name: _nibble_hexagon
      fillet: fk+kx
  _hexkey:
    - what: outline
      name: _key_hexagon
      fillet: fk
    - what: circle
      radius: 7
      where:
        shift: [0, -2]
      operation: stack
  _m2_nut:
    - what: polygon
      points:
        - shift: [-2.0, -1.155]
        - shift: [0, 2.31]
        - shift: [2.0, 1.155]
        - shift: [2.0, -1.155]
        - shift: [0, -2.31]
        - shift: [-2.0, -1.155]
      fillet: .6
  _choc_bot:
    - what: rectangle
      size: [10, 10]
      fillet: 1.1
  _choc_top_rect:
    - what: rectangle
      size: [10, 10]
      where:
        shift: [0, 5-2.2]
  _choc_top:
    - what: outline
      name: _choc_top_rect
    - what: outline
      name: _choc_top_rect
      where.rotate: -70
      operation: intersect
      fillet: 2.2
  _rect_45:
    - what: rectangle
      size: [(0.85+2)*1.4142, (0.85+2)*1.4142]
      where.rotate: 45
  _choc_tab:
    - what: rectangle
      size: [2.6, 0.8]
      fillet: 0.2
  _choc_socket:
    - what: rectangle
      size: [9.55, 6.85]
      where.shift: [-2.5, 1.1 - 5.9]
    - what: outline
      name: _choc_bot
      where.shift: [-7.5, 1.1 - 5.9 - 5 - 1.225]
      operation: subtract
    - what: outline
      name: _choc_top
      where.shift: [-0.3, 2.2-3.575]
      operation: subtract
      fillet: 0.8
    - what: outline
      name: _rect_45
      where.shift: [-3.5, -5.9 - 2.325 - 1]
      operation: subtract
    - what: outline
      name: _rect_45
      where.shift: [-1.5 + 4.775, -5.9 - 2.325 - 1]
      operation: subtract
    - what: outline
      name: _rect_45
      where.shift: [-1.5 + 4.775, -5.9 + 2.325 + 1]
      operation: subtract
  choc_socket_no_pad:
    - what: outline
      name: _choc_socket
    - what: rectangle
      size: [2.9, 2.9]
      where.shift: [-2.5 - 4.775 - 1.3, -5.9 + 2.2]
      operation: subtract
    - what: rectangle
      size: [2.9, 2.9]
      where.shift: [-2.5 + 4.775 + 1.3, -5.9]
      operation: subtract
  choc_socket:
    - what: outline
      name: _choc_socket
    - what: rectangle
      # Shrunk by 0.5mm on each side
      size: [4.2, 1.6]
      where.shift: [4.775 - 2.5, -5.9]
    - what: rectangle
      # Shrunk by 0.5mm on each side
      size: [4.2, 1.6]
      where.shift: [-4.775 - 2.5, -5.9 + 2.2]
    - what: outline
      name: _choc_tab
      where.shift: [-4.775 - 2.5 + 1, -1.775]
  __pcb_foam_switch:
    - what: outline
      name: choc_socket
    - what: rectangle
      size: [1.7, 3.85]
      where.shift: [6.2, -4.1]
    - what: circle
      radius: 0.95
      where:
        - shift: [-5.5, 0]
    - what: circle
      radius: 0.95
      where:
        - shift: [5.5, 0]
    - what: circle
      radius: 2.5
    - what: circle
      radius: 0.8
      where:
        - shift: [5, 5.15]
  _pcb_foam_switch:
    - what: outline
      name: __pcb_foam_switch
      expand: 1
  pcb_foam_switch:
    - what: outline
      name: _pcb_foam_switch
      expand: -1
  _pcb_foam_switch_rgb:
    - what: rectangle
      size: [3.2, 2.8]
      where.shift: [0, 4.93]
    - what: rectangle
      size: [7, 2.32]
      where.shift: [0, 4.93]
      expand: 1
    - what: outline
      name: _pcb_foam_switch
  pcb_foam_switch_rgb:
    - what: outline
      name: _pcb_foam_switch_rgb
      expand: -1
  _rgb_cutout:
    - what: rectangle
      where:
        shift: [0, 4.7]
      size: [3.6, 3.1]
      fillet: 0.2
  _switch_cutout1:
    - what: rectangle
      size: [13.8, 13.8]
      fillet: 1
  _ffc_cutout:
    - what: rectangle
      size: [7, 3]
      fillet: 1
  _mcu_cutout:
    - what: rectangle
      size: [17.78 + 4kx, 33.02 + 4kx]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-16.51]
      fillet: 2kx
  _display_main_cutout:
    - what: rectangle
      size: [12, 13]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-33.02]
      fillet: 2kx
  _display_raised_cutout:
    - what: rectangle
      size: [12, 7]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-33.02]
      fillet: 2kx
  _main_cutouts:
    - what: rectangle
      size: [2hx + dx + 2kx, 2mount_width]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top]
      fillet: mount_width/2
  _main_pcb_cutouts:
    - what: outline
      name: _main_cutouts
    - what: outline
      name: _mcu_cutout
      operation: subtract
      fillet: mount_width/2
    - what: outline
      name: _ffc_cutout
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2+17, -13hy/6]
      operation: add
  _main_plate_cutouts:
    - what: outline
      name: _main_cutouts
    - what: outline
      name: _mcu_cutout
      operation: add
    - what: outline
      name: _display_main_cutout
    - what: outline
      name: _ffc_cutout
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2+17, -13hy/6 - 1.5]
      operation: add
    # Make the plate symmetrical for easier assembly
    - what: outline
      name: _ffc_cutout
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2-17, -13hy/6 - 1.5]
      operation: add
  _trackball:
    - what: circle
      where:
        ref: t_c2_r1
        shift: [1.5hx + dx/2, -dy/2]
      radius: d_ball/2
  _trackball_deck_cutout:
    - what: circle
      where:
        ref: t_c2_r1
        shift: [1.5hx + dx/2, -dy/2]
      radius: d_ball/2 + 2kx
  _trackball_raised_cutout:
    - what: polygon
      points:
      - ref: t_c3_r1
        shift: [hx/2 - kx, -2hy/3 - ky/2]
      - shift: [0, hy]
      - shift: [-hx/2, hy/3]
      - shift: [0, 2hy/3 + dy + ky]
      - shift: [hx/2, hy/3]
      - shift: [0, 2hy/3]
      #- shift: [hx/2 + dx/2 + kx, hy/3 + dy/4 + ky/2]
      #- shift: [hx/2 + dx/2 + kx, -hy/3 - dy/4 - ky/2]
      - shift: [hx + dx + 2kx, 0]
      - shift: [0, -2hy/3]
      - shift: [hx/2, -hy/3]
      - shift: [0, -2hy/3 - dy - ky]
      - shift: [-hx/2, -hy/3]
      - shift: [0, -hy]
  _trackball_main_pcb_cutout:
    - what: polygon
      points:
      - ref: t_c3_r1
        shift: [hx/2 - kx, -2hy/3 - ky/2]
      - shift: [0, hy]
      - shift: [-hx/4, hy/6]
      - shift: [0, hy]
      - shift: [-hx/4, hy/6]
      - shift: [0, hy/3 + dy + ky]
      - shift: [hx + dx/2 + kx, 2hy/3 + dy/4 + ky/2]
      - shift: [hx + dx/2 + kx, -2hy/3 - dy/4 - ky/2]
      #- shift: [hx/2, hy/3]
      #- shift: [hx + dx + 2kx, 0]
      #- shift: [hx/2, -hy/3]
      - shift: [0, -hy/3 - dy - ky]
      - shift: [-hx/4, -hy/6]
      - shift: [0, -hy]
      - shift: [-hx/4, -hy/6]
      - shift: [0, -hy]
  _trackball_main_cutout:
    - what: polygon
      points:
      - ref: t_c3_r1
        shift: [hx/2 - kx, -2hy/3 - ky/2]
      - shift: [0, hy]
      - shift: [-hx/2, hy/3]
      - shift: [0, 4hy/3 + dy + ky]
      - shift: [hx + dx/2 + kx, 2hy/3 + dy/4 + ky/2]
      - shift: [hx + dx/2 + kx, -2hy/3 - dy/4 - ky/2]
      #- shift: [hx/2, hy/3]
      #- shift: [hx + dx + 2kx, 0]
      #- shift: [hx/2, -hy/3]
      - shift: [0, -4hy/3 - dy - ky]
      - shift: [-hx/2, -hy/3]
      - shift: [0, -hy]
  _raised_padded:
    $extends: outlines._raised_template
    $args: [kx, ky]
  _raised_external:
    - what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, 2hy/3-my]
        - shift: [-hx, -2hy/3]
        - shift: [-hx-mx, 2hy/3+my/2]
        - shift: [0, 2hy/3+my]
        - shift: [2hx/2, 2hy/3]

        - shift: [4hx+dx+2mx, 0]

        - shift: [2hx/2, -2hy/3]
        - shift: [0, -2hy/3-my]
        - shift: [-hx-mx, -2hy/3-my/2]
        - shift: [-hx, 2hy/3]
    - what: rectangle
      size: [3hx + dx, 4hy/3]
      where:
        ref: t_c2_r1
        shift: [3hx/2 + dx/2, 0]
      operation: add
    - what: rectangle
