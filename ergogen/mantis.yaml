pcbs:
  plate_main:
    outlines:
      main:
        outline: main_plate

  plate_raised:
    outlines:
      main:
        outline: raised_plate

  mantis_main:
    outlines:
      main:
        outline: main_pcb
      keys:
        outline: _main_key_silkscreen
        layer: B.SilkS
      plate:
        outline: main_plate
        layer: Dwgs.User
    footprints:
      mcu:
        what: promicro
        where:
          ref: f_c0_r3
          shift: [9hx/2+dx/2, mcu_top - 17.78]
          rotate: -90
        params:
          # Pin assignments
          #
          # SPI pins for VIK-out use pins P0-3, which won't work on an
          # original ProMicro, but work with RP2040 controllers and use
          # high-speed pins on nice!nano to prevent interference with
          # Bluetooth. ProMicro isn't really supported with VIK anyway as
          # VIK requires 3.3V logic. In a pinch, pins P0,1 could still
          # work with I2C.
          #
          # LED uses P4, which is another high-speed pin and supports SPI
          # MOSI on RP2040 and nice!nano.
          #
          # Left and right row nets are on the correct side for easier
          # routing. Columns use the remaining pins. There are not
          # enough pins to connect I2C, but it's not needed for common
          # trackball and trackpad modules. Jumpers can be used to
          # repurpose P0,1 for I2C in case a future Mantis variant needs
          # I2C instead of SPI.
          orientation: up
          # SPI
          P0: SPI_CS
          P1: MISO
          P2: SCLK
          P3: MOSI
          # LED
          P4: LED
          # Left rows
          P21: L3
          P20: L2
          P19: L1
          # Right rows
          P5: R3
          P6: R2
          P7: R1
          # Columns
          P18: C1
          P15: C2
          P14: C3
          P16: C4
          P10: C5
          P8: C6
          P9: C7
          # Power and reset
          RAW: RAW
          GND: GND
          RST: RST
          VCC: 3V3
      # VIK-out connector (use first 12 pins of promicro as placeholder)
      vik_out:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2 + 17, hy/3]
        params:
          designator: FFC
          RAW: 3V3
          GND: GND
          RST: SDA
          VCC: SCL
          P21: VIK_LED
          P20: VIK_5V
          P19: VIK_GPIO1
          P18: MOSI
          P15: VIK_GPIO2
          P14: SPI_CS
          P16: MISO
          P10: SCLK
      # Connector to top PCB (use first 12 pins of promicro as placeholder)
      to_top:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2, 0]
        params:
          designator: FFC
          RAW: LED_VCC
          GND: GND
          RST: TOP_LED
          VCC: BOT_LED
          P21: C1
          P20: C5
          P19: C6
          P18: C7
          P15: L1
          P14: L2
          P16: R2
          P10: R1
      keys:
        what: choc
        where: [          zn1_c2_r, zn1_c3_r, zn1_c4_r,
                zn2_c1_r, zn2_c2_r, zn2_c3_r, zn2_c4_r,
                zn3_c1_r, zn3_c2_r, zn3_c3_r, zn3_c4_r,
                zn3_c5_r, zn3_c7_r]
        asym: both
        adjust:
          rotate: 180
        params:
          from: "{{column_net}}"
          to: "{{column_net}}_{{row_net}}"
          keycaps: false
          hotswap: true
      diodes_r:
        what: diode
        where: [          zn1_c2_r, zn1_c3_r, zn1_c4_r,
                zn2_c1_r, zn2_c2_r, zn2_c3_r, zn2_c4_r,
                zn3_c1_r, zn3_c2_r, zn3_c3_r, zn3_c4_r,
                zn3_c5_r, zn3_c7_r]
        asym: source
        adjust:
          shift: [-6.2, -4.1]
          rotate: -90
        params:
          from: "{{column_net}}_{{row_net}}"
          to: "{{row_net}}"
      diodes_l:
        what: diode
        where: [          zn1_c2_r, zn1_c3_r, zn1_c4_r,
                zn2_c1_r, zn2_c2_r, zn2_c3_r, zn2_c4_r,
                zn3_c1_r, zn3_c2_r, zn3_c3_r, zn3_c4_r,
                zn3_c5_r, zn3_c7_r]
        asym: clone
        adjust:
          shift: [6.2, -4.1]
          rotate: 90
        params:
          from: "{{column_net}}_{{row_net}}"
          to: "{{row_net}}"
      mouse:
        what: choc
        where: zn3_c7_r
        asym: both
        adjust:
          shift: [3, 2hy/3 + 6.4 + 3]
        params:
          designator: "M"
          from: "C6"
          to: "C6_{{row_net}}"
          keycaps: false
          hotswap: false
      diode_mr:
        what: diode
        where: zn3_c7_r
        adjust:
          shift: [-1, 2hy/3 + 6.4/2 + 3]
          rotate: -90
        params:
          from: "C6_{{row_net}}"
          to: "{{row_net}}"
      diode_ml:
        what: diode
        where: mirror_zn3_c7_r
        adjust:
          shift: [-1, 2hy/3 + 6.4/2 + 3]
          rotate: 90
        params:
          from: "C6_{{row_net}}"
          to: "{{row_net}}"
      rgb:
        what: rgb
        where: [          zn1_c2_r, zn1_c3_r, zn1_c4_r,
                zn2_c1_r, zn2_c2_r, zn2_c3_r, zn2_c4_r,
                zn3_c1_r, zn3_c2_r, zn3_c3_r, zn3_c4_r,
                zn3_c5_r, zn3_c7_r]
        asym: both
        adjust.shift: [0, 4.93]
        params:
          side: B
          din: "DI_{{column_net}}_{{row_net}}"
          dout: "DO_{{column_net}}_{{row_net}}"
          VCC: LED_VCC

  mantis_raised:
    outlines:
      raised:
        outline: raised_pcb
      keys:
        outline: _raised_key_silkscreen
        layer: B.SilkS
      plate:
        outline: raised_plate
        layer: Dwgs.User
    footprints:
      # Connector to bottom PCB (use first 12 pins of promicro as placeholder)
      # Inverted pin assignment and 180° rotation for type A cable
      to_bot:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2, -7]
          rotate: 180
        params:
          designator: FFC
          RAW: L1
          GND: L2
          RST: R2
          VCC: R1
          P21: C7
          P20: C6
          P19: C5
          P18: C1
          P15: BOT_LED
          P14: TOP_LED
          P16: GND
          P10: LED_VCC
      keys:
        what: choc
        where: [zn1_c1_r, zn1_c5_r, zn1_c6_r, zn1_c7_r,
                          zn2_c5_r, zn2_c6_r, zn2_c7_r]
        asym: both
        adjust:
          rotate: 180
        params:
          from: "{{column_net}}"
          to: "{{column_net}}_{{row_net}}"
          keycaps: false
          hotswap: true
      diodes_r:
        what: diode
        where: [zn1_c1_r, zn1_c5_r, zn1_c6_r, zn1_c7_r,
                          zn2_c5_r, zn2_c6_r, zn2_c7_r]
        asym: source
        adjust:
          shift: [-6.2, -4.1]
          rotate: -90
        params:
          from: "{{column_net}}_{{row_net}}"
          to: "{{row_net}}"
      diodes_l:
        what: diode
        where: [zn1_c1_r, zn1_c5_r, zn1_c6_r, zn1_c7_r,
                          zn2_c5_r, zn2_c6_r, zn2_c7_r]
        asym: clone
        adjust:
          shift: [6.2, -4.1]
          rotate: 90
        params:
          from: "{{column_net}}_{{row_net}}"
          to: "{{row_net}}"
      rgb:
        what: rgb
        where: [zn1_c1_r, zn1_c5_r, zn1_c6_r, zn1_c7_r,
                          zn2_c5_r, zn2_c6_r, zn2_c7_r]
        adjust.shift: [0, 4.93]
        asym: both
        params:
          side: B
          din: "DI_{{column_net}}_{{row_net}}"
          dout: "DO_{{column_net}}_{{row_net}}"
          VCC: LED_VCC
