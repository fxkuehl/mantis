  sensor_pcb:
    - what: rectangle
      size: [hx+dx-1, 18.75]
      adjust:
        shift: [254, -127 + 18.75/2 - 5.9]
    - what: rectangle
      size: [2*hx+dx-1, 10.5]
      adjust:
        shift: [254, -127 + 10.5/2 - 5.9]
      operation: add
      fillet: 1
    - what: rectangle
      size: [8.6, 16.2]
      adjust:
        shift: [254, -127 + 16.2/2 - 5.96]
      operation: subtract

  composite_plates:
    - what: outline
      name: _main_external
    - what: outline
      name: _main_padded
      operation: stack
    - what: outline
      name: main_pcb
      operation: stack
    - what: outline
      name: main_plate
      adjust:
        shift: [0, 0.05]
      operation: stack
    - what: outline
      name: raised_pcb
      adjust:
        shift: [0, 0.07]
      operation: stack
    - what: outline
      name: raised_plate
      adjust:
        shift: [0, 0.1]
      operation: stack
  composite_shell:
