    - what: outline
      name: _raised_deck
      operation: stack
      adjust:
        shift: [0, 0.05]
    - what: outline
      name: _raised_padded
      operation: stack
      adjust:
        shift: [0, 0.05]
    - what: outline
      name: _hexkey
      where: [zn1_c1_r, zn1_c2_r, zn1_c3_r, zn1_c4_r, zn1_c5_r, zn1_c6_r, zn1_c7_r,
              zn2_c1_r, zn2_c2_r, zn2_c3_r, zn2_c4_r, zn2_c5_r, zn2_c6_r, zn2_c7_r,
              zn3_c1_r, zn3_c2_r, zn3_c3_r, zn3_c4_r, zn3_c5_r,           zn3_c7_r]
