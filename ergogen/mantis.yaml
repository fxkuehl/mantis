units:
  # Hex key spacing
  hx: 21.5
  hy: 18.62
  # Margin around the PCB
  mx: 2.75
  my: 1.1547mx
  # Distance between key clusters
  dx: 3
  dy: 1.1547dx
  # Space around keys and fillet radius
  kx: 0.54/2
  ky: 1.1547kx
  fk: 3
  # Trackball diameter
  d_ball: 34
  # MCU vertical offset from top row key center
  mcu_top: hy/3 + dy/2
  # Space for mounting HW near main PCB rear
  mount_width: 6

points:
  zones:
    # Just key positions for reference, without any rotation
    # Origin aligns the center/split line with both inch and mm rasters
    f:
      anchor:
        shift: [254-10hx/2-dx/2, -127+2hy]
      columns:
        c0:
          rows:
            r0: $unset
            r1: $unset
            r2:
              shift: [0]
        c1:
          rows:
            r0: $unset
          key:
            stagger: -hy
            spread: hx/2
        c2:
          rows:
            r0: $unset
        c3:
          rows:
            r1:
              shift: [hx/2]
          key:
            stagger: -hy
            spread: hx/2
        c4:
          rows:
            r0: $unset
        c5:
          rows:
            r0: $unset
            r1: $unset
            r2:
              shift: [0]
      rows:
        r0:
        r1:
        r2:
          shift: [hx/2]
        r3:
          shift: [hx/2]
    t:
      anchor:
        shift: [254-5hx/2-dx/2, -127-hy-dy]
      columns:
        c1:
        c2:
        c3:
          key:
            stagger: -hy
            spread: hx/2
      rows:
        r1:

    # This section defines the switch matrix. It's quite unintuitive.
    # 5x8 instead of 10x4 to reduce the number of controller pins needed
    # and arranged to minimize the number of pins to the top PCB (4x4).
    # Keys are rotated in 60° increments to make a simulated key well
    # with sculpted key caps. Define each "row" in its own zone to make
    # the key rotation easier. Otherwise the spread and stagger get very
    # confusing.
    #
    # Mirroring changes the row net, not the column net. Matrix rows
    # don't correspond with key rows. Think of them as zones instead.
    # There are only two zones with 4 "columns" on the top PCB describing
    # the left half. With mirror zones, that makes 4 zones x 4 columns.
    #
    # The remainging 2 zones + 2 mirrors are used for the outside
    # keys. The middle finger column is the only complete column with
    # 4 rows on the main PCB.
    z4:
      anchor:
        ref: f_c0_r2
      columns:
        c1:
          rows.l.rotate: 120
          key:
            column_net: C1
        c2:
          rows.l.rotate: 0
          key:
            spread: hx/2
            stagger: hy
            column_net: C2
        c3:
          key:
            column_net: C3
        c4:
          key:
            column_net: C4
        c5:
          key:
            column_net: C5
      rows:
        l:
          row_net: L4
          mirror.row_net: R4
          rotate: -60
    z3:
      anchor:
        ref: f_c1_r1
      columns:
        c1:
          rows.l.rotate: 180
          key:
            column_net: C1
        c2:
          key:
            spread: hx/2
            stagger: hy
            column_net: C2
        c3:
          rows.l.rotate: 180
          key:
            spread: hx/2
            stagger: -hy
            column_net: C3
        c4:
          key:
            spread: hx/2
            stagger: hy
            column_net: C4
        c5:
          key:
            column_net: C5
      rows:
        l:
          row_net: L3
          mirror.row_net: R3
          rotate: -120
    z2:
      anchor:
        ref: t_c1_r1
      columns:
        c1:
          rows.l.rotate: 60
          key:
            column_net: C1
        c2:
          key:
            spread: hx/2
            stagger: hy+dy
            column_net: C2
        c3:
          rows.l.rotate: -120
          key:
            spread: hx/2
            stagger: hy
            column_net: C3
        c4:
          rows.l.rotate: -60
          key:
            spread: hx/2
            stagger: hy
            column_net: C4
        c5:
          key:
            spread: -3hx/2
            stagger: -hy
            column_net: C5
      rows:
        l:
          row_net: L2
          mirror.row_net: R2
          rotate: 180
    z1:
      anchor:
        ref: t_c3_r1
      columns:
        c1:
          key:
            column_net: C1
        c2:
          key:
            spread: -hx/2
            stagger: hy
            column_net: C2
        c3:
          rows.l.rotate: -120
          key:
            spread: hx/2
            stagger: hy+dy
            column_net: C3
        c4:
          rows.l.rotate: -120
          key:
            spread: hx/2
            stagger: hy
            column_net: C4
        c5:
          rows.l.rotate: 180
          key:
            spread: -5hx/2
            stagger: -hy
            column_net: C5
      rows:
        l:
          row_net: L1
          mirror.row_net: R1
  key:
    spread: hx
    padding: hy
  mirror:
    ref: f_c5_r3
    distance: hx+dx

outlines:
  _main_template:
    $params: [mx, my]
    # All points of the main outline are relative to non-rotated
    # keys to keep it sane.
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, -2hy/3-my]
        - ref: t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: f_c0_r3
          shift: [hx/2, hy+my]
        - ref: f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: f_c0_r3
          shift: [5hx/2, hy+my]

        - ref: f_c0_r3
          shift: [9hx/2+dx/2, my-dy/4-hy/3]

        - ref: mirror_f_c0_r3
          shift: [5hx/2, hy+my]
        - ref: mirror_f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: mirror_f_c0_r3
          shift: [hx/2, hy+my]
        - ref: mirror_f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: mirror_f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: mirror_t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: mirror_t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: mirror_t_c3_r1
          shift: [0, -2hy/3-my]

        - ref: t_c3_r1
          shift: [hx+dx/2, -my+dy/4]
    mcu_fill:
      what: rectangle
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-4hy/3 + mx]
      size: [4hx+dx, 8hy/3]
      operation: add
      fillet: mx+kx+fk
  _main_split_template:
    $params: [mx, my]
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, -2hy/3-my]
        - ref: t_c3_r1
          shift: [-2hx-mx, 2hy/3-my/2]
        - ref: t_c3_r1
          shift: [-2hx-mx, 4hy/3+dy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, -hy-my/2]
        - ref: f_c0_r2
          shift: [-hx/2-mx, hy+my/2]
        - ref: f_c0_r3
          shift: [hx/2, hy+my]
        - ref: f_c0_r3
          shift: [3hx/2, hy/3+my]
        - ref: f_c0_r3
          shift: [5hx/2, hy+my]

        - ref: f_c0_r3
          shift: [7hx/2+mx, hy/3+my/2]
        - shift: [0, -4hy/3-my]
        - shift: [-2hx/2, -2hy/3]
        - shift: [0, -6hy/3-dy+my]
        - shift: [3hx/2, -3hy/3]
        - shift: [0, -2hy/3-my]
  _main_split:
    $extends: outlines._main_split_template
    $args: [0, 0]
  _main_internal:
    $extends: outlines._main_template
    $args: [0, 0]
  _main_padded:
    $extends: outlines._main_template
    $args: [kx, ky]
  _main_external:
    $extends: outlines._main_template
    $args: [mx, my]
  _raised_template:
    $params: [rx, ry]
    poly:
      what: polygon
      points:
        - ref: t_c3_r1
          shift: [hx+dx/2, -dy/4-(ry)+my]
        - shift: [-hx-dx/2-kx, 2hy/3+dy/4+ky/2]
        - shift: [0, -my]
        - shift: [-hx/2, -hy/3]
        - shift: [0, -ky]
        - shift: [-hx/2+kx, -hy/3+ky/2]
        - shift: [-hx-(rx), 2hy/3+(ry)/2]
        - shift: [0, 2hy/3+(ry)]
        - shift: [hx/2+kx, hy/3+ky/2]
        - shift: [0, 2hy/3+dy-ky]
        - shift: [hx/2, hy/3]
        - shift: [0, 2hy/3]
        - shift: [hx/2, hy/3]
        - shift: [0, 2hy/3]

        # Extended center to mount controller
        - shift: [hx/2, hy/3]
        - shift: [0, hy/3-(ry)/2+ky/2+(rx)+mcu_top]
        - shift: [2hx+dx+2(rx)-2kx, 0]
        - shift: [0, -hy/3+(ry)/2-ky/2-(rx)-mcu_top]
        - shift: [hx/2, -hy/3]

        # Fitted center for controller on the main PCB
        #- shift: [hx/2+rx, hy/3+ry/2]
        #- shift: [hx/2+rx, -hy/3-ry/2]
        #- shift: [0, -2hy/3]
        #- shift: [hx/2+dx/2-rx, -hy/3-dy/4+ry/2]

        #- shift: [hx/2+dx/2-rx, hy/3+dy/4-ry/2]
        #- shift: [0, 2hy/3]
        #- shift: [hx/2+rx, hy/3+ry/2]
        #- shift: [hx/2+rx, -hy/3-ry/2]
        # End center

        - shift: [0, -2hy/3]
        - shift: [hx/2, -hy/3]
        - shift: [0, -2hy/3]
        - shift: [hx/2, -hy/3]
        - shift: [0, -2hy/3-dy+ky]
        - shift: [hx/2+kx, -hy/3-ky/2]
        - shift: [0, -2hy/3-(ry)]
        - shift: [-hx-(rx), -2hy/3-(ry)/2]
        - shift: [-hx/2+kx, hy/3-ky/2]
        - shift: [0, ky]
        - shift: [-hx/2, hy/3]
        - shift: [0, my]
      fillet: fk+(rx)
  _raised:
    $extends: outlines._raised_template
    $args: [0, 0]

  _hexagon_template:
    $params: [kx, ky]
    poly:
      what: polygon
      points:
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
        - shift: [0, 2.0hy/3-(ky)]
        - shift: [hx/2-(kx), hy/3-(ky)/2]
        - shift: [hx/2-(kx), -hy/3+(ky)/2]
        - shift: [0, -2.0hy/3+(ky)]
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
  _half_hex_template:
    $params: [kx, ky]
    poly:
      what: polygon
      points:
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
        - shift: [0, 2.0hy/3-(ky)]
        - shift: [(hx-(kx))/2, -hy/3+(ky)/2]
        - shift: [(hx-(kx))/2,  hy/3-(ky)/2]
        - shift: [0, -2.0hy/3+(ky)]
        - shift: [-hx/2+(kx), -hy/3+(ky)/2]
  _key_hexagon:
    $extends: outlines._hexagon_template
    $args: [kx, ky]
  _nibble_hexagon:
    $extends: outlines._hexagon_template
    $args: [0, 0]
  _nibble_half_hex:
    $extends: outlines._half_hex_template
    $args: [0, 0]
  _key_slot_hexagon:
    $extends: outlines._hexagon_template
    $args: [-kx, -ky]
  _rounded_nibble:
    - what: outline
      name: _nibble_hexagon
      fillet: fk+kx
  _hexkey:
    - what: outline
      name: _key_hexagon
      fillet: fk
    - what: circle
      radius: 7
      where:
        shift: [0, -2]
      operation: stack
  _m2_nut:
    - what: polygon
      points:
        - shift: [-2.0, -1.155]
        - shift: [0, 2.31]
        - shift: [2.0, 1.155]
        - shift: [2.0, -1.155]
        - shift: [0, -2.31]
        - shift: [-2.0, -1.155]
      fillet: .6
  _rgb_cutout:
    - what: rectangle
      where:
        shift: [0, 4.7]
      size: [3.6, 3.1]
      fillet: 0.2
  _switch_cutout1:
    - what: rectangle
      size: [13.8, 13.8]
      fillet: 0.6
  _mcu_cutout:
    - what: rectangle
      size: [17.78 + 4kx, 33.02 + 4kx]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top-16.51]
      fillet: 2kx
  _mounting_cutout:
    - what: rectangle
      size: [2hx + dx + 2kx, 2mount_width]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top]
    - what: outline
      name: _mcu_cutout
      operation: subtract
      fillet: mount_width/2
  _main_cutouts:
    - what: rectangle
      size: [2hx + dx + 2kx, 2mount_width]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, mcu_top]
      fillet: mount_width/2
    - what: outline
      name: _mcu_cutout
  _trackball:
    - what: circle
      where:
        ref: t_c2_r1
        shift: [1.5hx + dx/2, -dy/2]
      radius: d_ball/2
  _trackball_deck_cutout:
    - what: circle
      where:
        ref: t_c2_r1
        shift: [1.5hx + dx/2, -dy/2]
      radius: d_ball/2 + 2kx
  _trackball_raised_cutout:
    - what: polygon
      points:
      - ref: t_c3_r1
        shift: [hx/2 - kx, -2hy/3 + ky]
      - shift: [0, hy]
      - shift: [-hx/2, hy/3]
      - shift: [0, 2hy/3 + dy]
      - shift: [hx/2, hy/3]
      - shift: [0, 2hy/3]
      #- shift: [hx/2 + dx/2 + kx, hy/3 + dy/4 + ky/2]
      #- shift: [hx/2 + dx/2 + kx, -hy/3 - dy/4 - ky/2]
      - shift: [hx + dx + 2kx, 0]
      - shift: [0, -2hy/3]
      - shift: [hx/2, -hy/3]
      - shift: [0, -2hy/3 - dy]
      - shift: [-hx/2, -hy/3]
      - shift: [0, -hy]
  _trackball_main_cutout:
    - what: polygon
      points:
      - ref: t_c3_r1
        shift: [hx/2 - kx, -2hy/3 + ky]
      - shift: [0, hy]
      - shift: [-hx/2, hy/3]
      - shift: [0, 4hy/3 + dy]
      #- shift: [hx + dx/2 + kx, 2hy/3 + dy/4 + ky/2]
      #- shift: [hx + dx/2 + kx, -2hy/3 - dy/4 - ky/2]
      - shift: [hx/2, hy/3]
      - shift: [hx + dx + 2kx, 0]
      - shift: [hx/2, -hy/3]
      - shift: [0, -4hy/3 - dy]
      - shift: [-hx/2, -hy/3]
      - shift: [0, -hy]
      operation: add
  _raised_padded:
    $extends: outlines._raised_template
    $args: [kx, ky]
  _raised_external:
    - what: polygon
      points:
        - ref: t_c3_r1
          shift: [0, 2hy/3-my]
        - shift: [-hx, -2hy/3]
        - shift: [-hx-mx, 2hy/3+my/2]
        - shift: [0, 2hy/3+my]
        - shift: [2hx/2, 2hy/3]

        - shift: [4hx+dx+2mx, 0]

        - shift: [2hx/2, -2hy/3]
        - shift: [0, -2hy/3-my]
        - shift: [-hx-mx, -2hy/3-my/2]
        - shift: [-hx, 2hy/3]
    - what: rectangle
      size: [3hx + dx, 4hy/3]
      where:
        ref: t_c2_r1
        shift: [3hx/2 + dx/2, 0]
      operation: add
    - what: rectangle
      size: [2hx+dx+2mx, 2(mx+kx)+hy]
      where:
        ref: f_c3_r3
        shift: [1.5hx+dx/2, mcu_top-hy/2]
      operation: add
      fillet: mx+kx+fk
    - what: outline
      name: _raised
      operation: add
      fillet: kx+fk
    - what: outline
      name: _rounded_nibble
      where: [z0_c5_r0, z3_c3_r3]
      asym: both
      operation: subtract
      fillet: my/2

  main_pcb:
    - what: outline
      name: _main_internal
    - what: outline
      name: _nibble_hexagon
      where: [f_c1_r3, f_c3_r3, f_c0_r2]
      asym: both
      adjust:
        shift: [-hx/2, hy]
      operation: subtract
    - what: outline
      name: _nibble_hexagon
      where: [f_c1_r1, f_c3_r0, t_c3_r1]
      asym: both
      adjust:
        shift: [-hx, 0]
      operation: subtract
      fillet: fk+kx
    - what: outline
      name: _trackball_main_cutout
      operation: subtract
      fillet: fk+2kx
    - what: outline
      name: _rgb_cutout
      where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
              z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
              z2_c5_l, z1_c1_l, z1_c5_l]
      asym: both
      operation: subtract
    - what: outline
      name: _mounting_cutout
      operation: subtract
  _main_deck:
    - what: outline
      name: _main_external
    - what: outline
      name: _key_slot_hexagon
      where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
              z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
              z2_c5_l, z1_c1_l, z1_c5_l]
      asym: both
      fillet: fk+2kx
      operation: subtract
    - what: outline
      name: _raised_padded
      operation: subtract
    - what: outline
      name: _trackball_deck_cutout
      operation: subtract
    - what: outline
      name: _mcu_cutout
      operation: subtract
  main_plate:
    - what: outline
      name: _main_internal
    - what: outline
      name: _nibble_hexagon
      where: [f_c0_r3]
      asym: both
      adjust:
        shift: [-hx, 0]
      operation: subtract
    - what: outline
      name: _nibble_half_hex
      where: [f_c3_r0, t_c3_r1]
      asym: both
      adjust:
        shift: [-hx, 0]
      operation: subtract
      fillet: fk+kx
    - what: outline
      name: _trackball_main_cutout
      operation: subtract
      fillet: fk+2kx
    - what: outline
      name: _switch_cutout1
      where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
              z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
              z2_c5_l, z1_c1_l, z1_c5_l]
      asym: both
      operation: subtract
    - what: outline
      name: _main_cutouts
      operation: subtract
  main_split_plate:
    - what: outline
      name: _main_split
    - what: outline
      name: _nibble_hexagon
      where: [f_c0_r3]
      asym: left
      adjust:
        shift: [-hx, 0]
      operation: subtract
    - what: outline
      name: _nibble_half_hex
      where: [f_c3_r0, t_c3_r1]
      asym: left
      adjust:
        shift: [-hx, 0]
      operation: subtract
      fillet: fk+kx
    - what: outline
      name: _switch_cutout1
      where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
              z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
              z2_c5_l, z1_c1_l, z1_c5_l]
      asym: left
      operation: subtract
  raised_pcb:
    - what: outline
      name: _raised
    - what: outline
      name: _trackball_raised_cutout
      operation: subtract
      fillet: fk
    - what: rectangle
      size: [3hx, 4hy/3+kx]
      where:
        ref: f_c0_r3
        shift: [9hx/2+dx/2, hy/3]
      operation: subtract
    - what: outline
      name: _nibble_hexagon
      where: [t_c3_r1]
      asym: both
      adjust:
        shift: [-hx, 0]
      operation: subtract
      fillet: fk+kx
    - what: outline
      name: _rgb_cutout
      where: [z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
              z1_c2_l, z1_c3_l, z1_c4_l]
      asym: both
      operation: subtract
    - what: outline
      name: _mcu_cutout
      operation: subtract
  _raised_key_slots:
    - what: outline
      name: _key_slot_hexagon
      where: [z4_c5_l, z3_c5_l, z2_c5_l, z1_c5_l,
              z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
              z1_c1_l, z1_c2_l, z1_c3_l, z1_c4_l]
      asym: both
      fillet: fk+2kx
  _raised_deck:
    - what: outline
      name: _raised_external
    - what: outline
      name: _raised_key_slots
      operation: subtract
    - what: outline
      name: _trackball_deck_cutout
      operation: subtract

  raised_plate:
    - what: outline
      name: _raised
      fillet: fk+kx
    - what: outline
      name: _trackball_raised_cutout
      operation: subtract
      fillet: fk+2kx
    - what: outline
      name: _switch_cutout1
      where: [z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
              z1_c2_l, z1_c3_l, z1_c4_l]
      asym: both
      operation: subtract
    - what: outline
      name: _mcu_cutout
      operation: subtract
  sensor_pcb:
    - what: rectangle
      size: [hx+dx-1, 18.75]
      adjust:
        shift: [254, -127 + 18.75/2 - 6.96]
    - what: rectangle
      size: [2*hx+dx-1, 10.5]
      adjust:
        shift: [254, -127 + 10.5/2 - 6.96]
      operation: add
      fillet: 1
    - what: rectangle
      size: [8.6, 16.2]
      adjust:
        shift: [254, -127 + 16.2/2 - 5.96]
      operation: subtract

  composite_plates:
    - what: outline
      name: _main_external
    - what: outline
      name: _main_padded
      operation: stack
    - what: outline
      name: main_pcb
      operation: stack
    - what: outline
      name: main_plate
      adjust:
        shift: [0, 0.05]
      operation: stack
    - what: outline
      name: raised_pcb
      adjust:
        shift: [0, 0.07]
      operation: stack
    - what: outline
      name: raised_plate
      adjust:
        shift: [0, 0.1]
      operation: stack
  composite_shell:
    - what: outline
      name: _main_deck
    - what: outline
      name: _raised_deck
      operation: stack
      adjust:
        shift: [0, 0.05]
  composite_keys:
    - what: outline
      name: _main_deck
    - what: outline
      name: _raised_deck
      operation: stack
      adjust:
        shift: [0, 0.05]
    - what: outline
      name: _raised_padded
      operation: stack
      adjust:
        shift: [0, 0.05]
    - what: outline
      name: _hexkey
      where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
              z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
              z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l, z2_c5_l,
              z1_c1_l, z1_c2_l, z1_c3_l, z1_c4_l, z1_c5_l]
      asym: both
      operation: stack
    - what: outline
      name: _trackball
      operation: stack

pcbs:
  plate_main:
    outlines:
      main:
        outline: main_plate

  plate_raised:
    outlines:
      main:
        outline: raised_plate

  mantis_main:
    outlines:
      main:
        outline: main_pcb
    footprints:
      mcu:
        what: promicro
        where:
          ref: f_c0_r3
          shift: [9hx/2+dx/2, mcu_top - 17.78]
          rotate: -90
        params:
          # Pin assignments: Left and right row nets are
          # on the correct side for easier routing. SPI pins
          # are connected to VIK out. Columns and LED use the
          # remaining pins. There are not enough enough pins
          # to connect I2C, but it's not needed for common
          # trackball and trackpad modules. I2C pins can be
          # broken out on the PCB and hand-wired to extra
          # pins available on some controllers if absolutely
          # needed.
          orientation: down
          # SPI
          P15: SCLK
          P14: MISO
          P16: MOSI
          P10: SPI_CS
          # Left rows
          P21: L4
          P20: L3
          P19: L2
          P18: L1
          # Right rows
          P2: R4
          P3: R3
          P4: R2
          P5: R1
          # Columns
          P0: C5
          P6: C4
          P7: C3
          P8: C2
          P9: C1
          # LED
          P1: TOP_LED
          # Power and reset
          RAW: 5V
          GND: GND
          RST: RST
          VCC: 3_3V
      # Optional reset button
      reset:
        what: button
        where:
          ref: f_c0_r3
          shift: [9hx/2+dx/2, mcu_top-7]
        params:
          side: B
          from: GND
          to: RST
      # VIK-out connector (use first 12 pins of promicro as placeholder)
      vik_out:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2 + 17, -hy/3]
        params:
          designator: FFC
          RAW: 3_3V
          GND: GND
          RST: SDA
          VCC: SCL
          P21: VIK_LED
          P20: 5V
          P19: VIK_GPIO1
          P18: MOSI
          P15: VIK_GPIO2
          P14: SPI_CS
          P16: MISO
          P10: SCLK
      # Connector to top PCB (use first 12 pins of promicro as placeholder)
      to_top:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2, 0]
        params:
          designator: FFC
          RAW: RAW
          GND: GND
          RST: TOP_LED
          VCC: BOT_LED
          P21: C1
          P20: C2
          P19: C3
          P18: C4
          P15: R1
          P14: R2
          P16: L2
          P10: L1
      keys:
        what: choc
        where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
                z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
                z2_c5_l, z1_c1_l, z1_c5_l]
        asym: both
        adjust:
          rotate: 180
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          keycaps: false
          hotswap: true
      diodes:
        what: diode
        where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
                z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
                z2_c5_l, z1_c1_l, z1_c5_l]
        asym: both
        adjust:
          shift: [0, -3.5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      rgb:
        what: rgb
        where: [z4_c1_l, z4_c2_l, z4_c3_l, z4_c4_l, z4_c5_l,
                z3_c1_l, z3_c2_l, z3_c3_l, z3_c4_l, z3_c5_l,
                z2_c5_l, z1_c1_l, z1_c5_l]
        asym: both
        adjust.shift: [0, 4.7]
        params:
          side: B
          din: "di_{{colrow}}"
          dout: "do_{{colrow}}"
          VCC: 5V

  mantis_raised:
    outlines:
      raised:
        outline: raised_pcb
    footprints:
      # Connector to bottom PCB (use first 12 pins of promicro as placeholder)
      to_bot:
        what: promicro
        where:
          ref: f_c5_r3
          shift: [hx/2+dx/2, 0]
        params:
          designator: FFC
          RAW: RAW
          GND: GND
          RST: TOP_LED
          VCC: BOT_LED
          P21: C1
          P20: C2
          P19: C3
          P18: C4
          P15: R1
          P14: R2
          P16: L2
          P10: L1
      keys:
        what: choc
        where: [z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
                z1_c2_l, z1_c3_l, z1_c4_l]
        asym: both
        adjust:
          rotate: 180
        params:
          from: "{{column_net}}"
          to: "{{colrow}}"
          keycaps: false
          hotswap: true
      diodes:
        what: diode
        where: [z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
                z1_c2_l, z1_c3_l, z1_c4_l]
        asym: both
        adjust:
          shift: [0, -3.5]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
      rgb:
        what: rgb
        where: [z2_c1_l, z2_c2_l, z2_c3_l, z2_c4_l,
                z1_c2_l, z1_c3_l, z1_c4_l]
        adjust.shift: [0, 4.7]
        asym: both
        params:
          side: B
          din: "di_{{colrow}}"
          dout: "do_{{colrow}}"
          VCC: 5V
